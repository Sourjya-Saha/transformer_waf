services:
  # Tier 1: Public Reverse Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: waf_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - frontend-net
    depends_on:
      - firewall

  # Tier 2: Web Application Firewall (WAF)
  firewall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waf_gateway
    restart: unless-stopped
    environment:
      - WAF_BACKEND_URL=http://backend:8080
      - WAF_HOST=0.0.0.0
      - WAF_PORT=8000
      - WAF_LOG_DIR=/app/logs
      - WAF_LOG_FILE=/app/logs/waf.log
      - WAF_RATE_LIMIT_ALGORITHM=token_bucket
      - WAF_RATE_LIMIT_REQUESTS_PER_MINUTE=100
      - WAF_RATE_LIMIT_BURST=20
    volumes:
      - ./logs:/app/logs
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - backend

  # Tier 3: Isolated Backend Web Application (Zero Public Access)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waf_backend
    restart: unless-stopped
    networks:
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    internal: true  # Isolated network, inaccessible from outside
