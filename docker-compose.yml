services:
  # Tier 1: Public Reverse Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: waf_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - frontend-net
    depends_on:
      - firewall

  # Tier 2: Transformer-Based Web Application Firewall (WAF)
  firewall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waf_gateway
    restart: unless-stopped
    environment:
      - WAF_HOST=0.0.0.0
      - WAF_PORT=8000
      - WAF_PROXY=http://backend:8080
      - WAF_BLOCK=false  # Set to true for active blocking; false for monitor mode
    volumes:
      - ./waf/waf_chain.jsonl:/app/waf_chain.jsonl
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - backend

  # Tier 3: Isolated Backend Web Application (Zero Public Access)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waf_backend
    restart: unless-stopped
    networks:
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    internal: true  # Isolated network, inaccessible from outside
