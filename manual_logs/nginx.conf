events {
    worker_connections 1024;
}

http {
    # 1. Custom Standard Log Format (Text)
    log_format custom_text '$remote_addr - [$time_iso8601] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" rt=$request_time';

    # 2. Custom Structured JSON Log Format
    log_format custom_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    server {
        # Nginx listens on port 80 (or any chosen entry port)
        listen 80;
        server_name localhost;

        # Direct log paths inside the container mapped to your manual_logs folder
        access_log /var/log/nginx/manual_logs.txt custom_text;
        access_log /var/log/nginx/manual_logs.json custom_json;
        error_log /var/log/nginx/error.log warn;

        location / {
            # Forward traffic to Juice Shop running on host port 3000
            # 'host.docker.internal' reaches your host machine's localhost from Docker
            proxy_pass http://host.docker.internal:3000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
