events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstream Web Application Firewall Gateway
    upstream waf_upstream {
        server firewall:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Client body size limit matching WAF settings (10MB)
        client_max_body_size 10M;

        location / {
            proxy_pass http://waf_upstream;
            
            # HTTP 1.1 with Keep-Alive for upstream connection
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Client Network Identification Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}